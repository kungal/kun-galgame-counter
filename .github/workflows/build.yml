# Build the kungal-counter web image and push to GHCR, then trigger a Dokploy
# redeploy. Mirrors the rest of the ecosystem's CI — see
# ../nextmoe-infra/docs/deploy/13-registry-ci.md.
#
# This repo is a SINGLE standalone Nuxt app (the "down for maintenance" page +
# vote counter): no Go api/migrate/tools images, and no build args — its only
# runtime knob, COUNTER_IP_SALT, is read at RUNTIME from docker/web.env, so one
# generic image works in any environment. Hence a single build (no matrix).
name: build-and-push

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/nuxt.Dockerfile
          push: true
          tags: |
            ghcr.io/kungal/counter-web:latest
            ghcr.io/kungal/counter-web:${{ github.sha }}
          cache-from: type=gha,scope=counter-web
          cache-to: type=gha,mode=max,scope=counter-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy redeploy
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK_COUNTER }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DOKPLOY_WEBHOOK_COUNTER not set — image pushed to GHCR, skipping redeploy trigger."
            exit 0
          fi
          curl -fsS -X POST "$WEBHOOK"
