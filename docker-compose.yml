# kun-galgame-counter — DEV / local compose.
#
# A standalone Nuxt 4 SSR "down for maintenance" page + a tiny vote counter.
# Unlike kungal/moyu it owns NO backing services and joins NO shared network:
# no Postgres/Redis/OAuth/image — the only state is the vote tally, persisted to
# a JSON file on a local named volume. Just one `web` container.
#
# Dev: build locally + publish a host port (1xxxx range, coexists with a running
# `air`/`nuxt dev`). For production (Dokploy + Traefik + GHCR image) see
# docker-compose.prod.yml. Philosophy: ../nextmoe-infra/docs/deploy.
#
# Port config: WEB_PORT / HOST_PORT, with inline defaults below so it runs with
# NO .env at all. To override, set them in .env (gitignored; copy .env.example)
# for local, or in Dokploy's Environment for prod — don't edit the numbers here.
#
#   docker compose build
#   docker compose up -d
#   curl -I http://localhost:15014/        # 503 (intentional); 15014 = HOST_PORT
name: kungal-counter

services:
  web:
    build:
      context: .
      dockerfile: docker/nuxt.Dockerfile
    image: kungal-counter/web
    # COUNTER_IP_SALT only. Optional in dev (the app has a built-in fallback), so
    # the file is not required — copy docker/web.env.example to docker/web.env to
    # set it. Rotate / set a real value in prod.
    env_file:
      - path: ./docker/web.env
        required: false
    environment:
      NITRO_PORT: ${WEB_PORT:-2326} # listen port; override via .env (see .env.example)
    ports: ["${HOST_PORT:-15014}:${WEB_PORT:-2326}"]
    volumes:
      - counter-data:/app/server/data
    healthcheck:
      # The page returns 503 by design (maintenance), so an HTTP probe on `/`
      # would read as unhealthy. node-slim has no curl either — use a tiny TCP
      # liveness probe. It reads NITRO_PORT so it tracks WEB_PORT automatically.
      test:
        - CMD
        - node
        - -e
        - "const p=process.env.NITRO_PORT||3000;require('net').connect(p,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  counter-data:
